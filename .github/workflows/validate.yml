name: Validate against SWAT+

# Runs the SWAT+ Fortran engine (from the fortran-bin branch) and swatplus-rust on the reference
# scenarios and on the phase 2 variants of Ames_sub1 (scripts/make-variants.sh), and compares
# every daily table the port writes, value by value. The tolerance is decision K12 of the design:
# a relative difference of 1e-4, or one unit in the last printed decimal.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Batanghari and Pessel are private data, kept in andriyanto/swatplus-testdata and read
      # with a read-only token. Without it (a fork's pull request) only SWAT+'s own scenarios
      # and their variants run.
      - name: Get the private scenarios
        env:
          TOKEN: ${{ secrets.TESTDATA_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=private scenarios::no TESTDATA_TOKEN: Batanghari, Pessel and their variants are skipped"
            exit 0
          fi
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/andriyanto/swatplus-testdata.git" private
          mv private/Batanghari private/Pessel testdata/
          rm -rf private

      - name: Get the SWAT+ Fortran engine
        run: |
          git fetch --depth 1 origin fortran-bin
          git show origin/fortran-bin:swatplus-fortran > swatplus-fortran
          git show origin/fortran-bin:README.txt
          chmod +x swatplus-fortran
          echo "FORTRAN=$PWD/swatplus-fortran" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build swatplus-rust
        run: |
          cargo build --release -p swatplus-rust
          echo "RUST=$PWD/target/release/swatplus-rust" >> "$GITHUB_ENV"

      - name: Run and compare
        run: |
          status=0
          trap 'echo "::error title=stopped::at scenario ${scenario:-none} (line $LINENO)"' ERR
          scripts/make-variants.sh testdata/Ames_sub1 variants
          scenarios="Osu_1hru Ames_sub1 Ames_bare Ames_past0 Ames_past Ames_corn Ames_cornf Ames_cosy Ames_cosy2 Ames_dtbl Ames_tile"
          if [ -d testdata/Batanghari ]; then
          scenarios="$scenarios Bh_land Batanghari Bh_res Bh_rel Ps_coast Ps_paddy Ps_musk Ps_atmo Ps_tile Ps_bmp Ps_septic Ps_solp Ps_urban Ps_hourly Ps_land Ps_urbhr Ps_pet Ps_cal Ps_harv Ps_peren Ps_hu Ps_uh Ps_gap Ps_edge Bh_nosed Pessel"
          # Phase 3: Batanghari (and Bh_land, its HRUs with Hargreaves PET), 2015-2019 (three
          # printed years) to keep the tables small.
          scripts/make-phase3-variants.py testdata/Batanghari variants
          sed -i '3s/2025/2019/' variants/Bh_land/time.sim testdata/Batanghari/time.sim
          # Phase 3e: Pessel's coastal lowland, 2015-2017 (the script cuts it out and shortens it), and
          # phase 4: the same with its rice as paddies (Ps_paddy).
          scripts/make-pessel-variants.py testdata/Pessel variants
          # Phase 4: Batanghari with a reservoir and two point sources, 2015-2017.
          scripts/make-reservoir-variants.py testdata/Batanghari variants
          # And the whole of Pessel, 2015 only, printed from the first day.
          sed -i '3s/2025/2015/' testdata/Pessel/time.sim
          sed -i '3s/^2 /0 /' testdata/Pessel/print.prt
          fi
          for scenario in $scenarios; do
            src=testdata/$scenario
            test -d "$src" || src=variants/$scenario
            mkdir -p runs/$scenario
            cp -r "$src" runs/$scenario/fortran
            scripts/print-daily.sh runs/$scenario/fortran hru_wb,hru_pw,hru_nb,hru_ls,ru,aquifer,channel_sd,basin_wb,basin_nb,basin_ls,basin_pw,lsunit_wb,lsunit_nb,lsunit_ls,lsunit_pw,basin_sd_cha,reservoir,basin_res,recall,basin_psc hru_cb,hru_cb_vars
            (cd runs/$scenario/fortran && "$FORTRAN" > run.log 2>&1)
            test -f runs/$scenario/fortran/success.fin
            # The port reads the same print.prt (the folder's SWAT+ output is no input).
            "$RUST" run runs/$scenario/fortran --out runs/$scenario/rust 2> runs/$scenario/rust.log || { echo "::error title=$scenario port::$(tail -3 runs/$scenario/rust.log | tr '\n' ' ')"; exit 1; }
            for stem in hru_wb hru_pw hru_nb hru_ls ru aquifer channel_sd basin_wb basin_nb basin_ls basin_pw lsunit_wb lsunit_nb lsunit_ls lsunit_pw basin_sd_cha reservoir basin_res recall basin_psc; do for period in day mon yr aa subday; do
              table=${stem}_$period
              # The port writes the nutrient tables, and the period tables, only for the HRUs it
              # simulates in full.
              test -f runs/$scenario/rust/$table.txt || continue
              if "$RUST" compare runs/$scenario/fortran/$table.txt runs/$scenario/rust/$table.txt > runs/$scenario/$table.cmp; then
                echo "::notice title=$scenario $table::$(grep -c '^  ok' runs/$scenario/$table.cmp) columns match, $(head -1 runs/$scenario/$table.cmp | cut -d: -f2)"
              else
                status=1
                echo "::error title=$scenario $table::$(grep -E 'MISMATCH|missing|not in' runs/$scenario/$table.cmp | head -3 | tr -s ' ' | paste -sd ';' -)"
              fi
              cat runs/$scenario/$table.cmp
            done; done
            if ! scripts/compare-yields.py runs/$scenario/fortran runs/$scenario/rust > runs/$scenario/yields.cmp; then
              status=1
              echo "::error title=$scenario crop yields::$(grep -v ' 0 mismatches' runs/$scenario/yields.cmp | head -3 | paste -sd ';' -)"
            fi
            cat runs/$scenario/yields.cmp
            # Batanghari's daily tables run to gigabytes.
            rm -f runs/$scenario/fortran/*_day.txt runs/$scenario/rust/*_day.txt runs/$scenario/fortran/*_subday.txt runs/$scenario/rust/*_subday.txt
          done
          exit $status
      - name: Keep the comparisons
        if: always()
        run: |
          mkdir -p validation-logs
          for d in runs/*/; do n=$(basename "$d"); mkdir -p validation-logs/$n; cp "$d"*.cmp validation-logs/$n/ 2>/dev/null || true; done
          scripts/validation-summary.py validation-logs "Commit \`$GITHUB_SHA\`, run $GITHUB_RUN_ID, $(date -u +%Y-%m-%d)." > validation-logs/summary.md
          cat validation-logs/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: validation-logs
          retention-days: 90
      # The latest run on main (or started by hand) also goes to the validation-logs branch, so the
      # logs can be fetched with git for the archive the paper cites.
      - name: Publish to the validation-logs branch
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd validation-logs
          git init -q -b validation-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Validation logs of ${GITHUB_SHA:0:7} (run $GITHUB_RUN_ID)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" validation-logs
