name: Release

# Pushing a tag v* builds the command line program for Linux, macOS and Windows and the
# WebAssembly module, and publishes them as a GitHub release with the licence and notice.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: swatplus-rust }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: swatplus-rust }
          - { os: macos-13, target: x86_64-apple-darwin, exe: swatplus-rust }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: swatplus-rust.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p swatplus-rust --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=swatplus-rust-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} LICENSE NOTICE README.md "$name"/
          cp docs/runner.md "$name"/
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" > /dev/null; else tar -czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: swatplus-rust-*.*

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --locked -p swat-wasm --target wasm32-unknown-unknown
      - name: Package
        run: |
          name=swat-wasm-${GITHUB_REF_NAME}
          mkdir "$name"
          cp target/wasm32-unknown-unknown/release/swat_wasm.wasm scripts/wasm-run.mjs LICENSE NOTICE docs/runner.md "$name"/
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: swat-wasm-*.tar.gz

  publish:
    needs: [build, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release made on GitHub first (with its notes) gets the files; otherwise it is made here.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "swatplus-rust ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
          fi
