name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        # Each diagnostic is also emitted as an annotation, readable without the job log.
        run: |
          status=0
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings > clippy.txt 2>&1 || status=$?
          grep -E 'error|warning|panicked' clippy.txt | head -20 | sed 's/^/::error::/'
          cat clippy.txt
          exit $status
      - name: Test
        run: cargo test --workspace
      - name: Inspect the reference scenarios
        run: |
          cargo run -q -p swatplus-rust -- inspect testdata/Osu_1hru
          cargo run -q -p swatplus-rust -- inspect testdata/Ames_sub1

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the libraries for the browser
        run: cargo build --target wasm32-unknown-unknown -p swat-model -p swat-io

  msrv:
    name: Minimum Rust version (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - run: cargo build --workspace
