name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        # Each diagnostic is also emitted as an annotation, readable without the job log.
        run: |
          status=0
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings > clippy.txt 2>&1 || status=$?
          grep -E 'error|warning|panicked' clippy.txt | head -20 | sed 's/^/::error::/'
          cat clippy.txt
          exit $status
      - name: Test
        run: cargo test --workspace
      - name: Inspect the reference scenarios
        run: |
          cargo run -q -p swatplus-rust -- inspect testdata/Osu_1hru
          cargo run -q -p swatplus-rust -- inspect testdata/Ames_sub1

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the module for the browser
        run: |
          cargo build --release --target wasm32-unknown-unknown -p swat-wasm 2> build.log || { tail -20 build.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Osu_1hru in WebAssembly matches the native run
        run: |
          exec > >(tee run.log) 2>&1
          trap 'tail -25 run.log | while IFS= read -r l; do echo "::error::$l"; done' ERR
          set -eE
          cargo build --release -p swatplus-rust
          ls -la target/wasm32-unknown-unknown/release/swat_wasm.wasm
          tar -cf /tmp/osu.tar -C testdata Osu_1hru
          node scripts/wasm-run.mjs target/wasm32-unknown-unknown/release/swat_wasm.wasm /tmp/osu.tar /tmp/osu-out.tar 3
          mkdir /tmp/wasm-out && tar -xf /tmp/osu-out.tar -C /tmp/wasm-out
          cat /tmp/wasm-out/run.json
          grep -q '"ok":true' /tmp/wasm-out/run.json
          target/release/swatplus-rust run testdata/Osu_1hru --out /tmp/native-out
          n=0
          for f in /tmp/native-out/*.txt; do
            cmp "$f" "/tmp/wasm-out/$(basename "$f")" || n=$((n+1))
            n=$n
          done
          echo "$(ls /tmp/native-out/*.txt | wc -l) tables, $n differ"
          test "$n" = 0

  parquet:
    name: Parquet tables read by DuckDB and Arrow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb pyarrow
      - run: cargo build --release
      - name: Osu_1hru as text and Parquet, every table daily
        run: |
          cp -r testdata/Osu_1hru /tmp/osu
          scripts/print-daily.sh /tmp/osu hru_wb,hru_pw,hru_nb,hru_ls,ru,aquifer,channel_sd,basin_wb,basin_nb,basin_ls,basin_pw,lsunit_wb hru_cb > /dev/null
          target/release/swatplus-rust run /tmp/osu --out /tmp/osu-out --format both --progress json | tail -3
          scripts/check-parquet.py /tmp/osu-out

  msrv:
    name: Minimum Rust version (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - run: cargo build --workspace
